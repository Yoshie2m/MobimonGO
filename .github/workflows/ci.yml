# push と Pull Request のたびに、整形・lint・テスト・ビルド・生成ファイルの食い違いを確かめる。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: チェック
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      - name: 整形チェック
        run: npm run format:check

      - name: lint(依存の向きのルールを含む)
        run: npm run lint

      - name: テスト(データの移行のテストを含む)
        run: npm test

      - name: ビルド(型チェックを含む)
        run: npm run build

      - name: tokens.css が tokens.json から生成したものと一致するか
        run: |
          npm run design:tokens
          git diff --exit-code src/ui/design-system/tokens.css || {
            echo "::error file=src/ui/design-system/tokens.css::tokens.css が tokens.json と食い違っています。npm run design:tokens を実行してコミットしてください"
            exit 1
          }

  e2e:
    name: 画面の自動テスト(E2E)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      # Chromium は Playwright の版が変わらない限り再利用する
      - name: Chromium のキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chromium のインストール
        run: npx playwright install --with-deps --only-shell chromium

      - name: E2E テスト(本番用のビルドを相手にする)
        run: npm run e2e

      - name: 失敗したときの報告と記録を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
